<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Logic Reset</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #050505; color: white; font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #111; padding: 2rem; border-radius: 20px; width: 100%; max-width: 380px; border: 1px solid #333; box-shadow: 0 0 30px rgba(0,255,255,0.1); }
        input { background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 10px; width: 100%; margin-bottom: 12px; outline: none; text-align: center; font-size: 1.1rem; }
        input:focus { border-color: #00d4ff; }
        button { width: 100%; background: linear-gradient(90deg, #00d4ff, #0055ff); color: white; font-weight: bold; padding: 14px; border-radius: 10px; cursor: pointer; border: none; text-transform: uppercase; letter-spacing: 1px; }
        #result { margin-top: 25px; text-align: center; }
        .display-char { font-size: 6rem; font-weight: 800; text-shadow: 0 0 20px currentColor; transition: 0.3s; }
    </style>
</head>
<body>

    <div class="card">
        <h2 style="text-align: center; margin-bottom: 20px; color: #00d4ff; font-weight: 300;">AI ANALYZER</h2>
        
        <input type="text" id="seq" placeholder="Dãy số (VD: 1234)" maxlength="5">
        <input type="text" id="code" placeholder="Mã số (VD: #1)">
        
        <div style="display: flex; gap: 10px;">
            <input type="number" id="v1" placeholder="Số 1">
            <input type="number" id="v2" placeholder="Số 2">
        </div>

        <button onclick="runLogic()">Phân tích kết quả</button>

        <div id="result">
            <div id="char" class="display-char">-</div>
            <div id="debug" style="font-size: 0.75rem; color: #555; margin-top: 10px; font-family: monospace;"></div>
        </div>
    </div>

    <script>
        function sumToOneDigit(n) {
            n = Math.abs(n);
            if (n === 0) return 0;
            let res = n % 9;
            return res === 0 ? 9 : res;
        }

        function runLogic() {
            const sequence = document.getElementById('seq').value;
            const codeInput = document.getElementById('code').value;
            const add1 = parseInt(document.getElementById('v1').value) || 0;
            const add2 = parseInt(document.getElementById('v2').value) || 0;

            if (sequence.length < 4 || !codeInput.startsWith('#')) {
                alert("Vui lòng nhập đúng dãy số (4-5 số) và mã #");
                return;
            }

            let n = sequence.length;
            let index = parseInt(codeInput.replace('#', ''));

            // LOGIC RESET: 
            // Nếu là #1 -> lấy index 0, 1
            // Nếu là #2 -> lấy index 1, 2
            // Nếu là #3 -> lấy index 2, 3
            // Nếu là #4 (của dãy 4) -> Quay về lấy index 0, 1
            let pos1 = (index - 1) % (n - 1);
            let pos2 = pos1 + 1;

            let numA = parseInt(sequence[pos1]);
            let numB = parseInt(sequence[pos2]);

            let final1 = sumToOneDigit(numA + add1);
            let final2 = sumToOneDigit(numB + add2);

            let resChar = "H", resColor = "#ffcc00";
            if (final1 > final2) { resChar = "P"; resColor = "#ff4d4d"; }
            else if (final1 < final2) { resChar = "B"; resColor = "#00ff88"; }

            const charDiv = document.getElementById('char');
            charDiv.innerText = resChar;
            charDiv.style.color = resColor;
            
            document.getElementById('debug').innerText = 
                `Mã ${codeInput} lấy cặp: (${numA}, ${numB}) | Tổng: ${final1} vs ${final2}`;
        }
    </script>
</body>
</html>
