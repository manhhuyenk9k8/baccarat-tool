<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Number Logic Processor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); min-height: 100vh; color: white; font-family: 'Segoe UI', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 1rem; }
        .input-style { background: rgba(0, 0, 0, 0.2); border: 1px solid #334155; border-radius: 0.5rem; padding: 0.75rem; width: 100%; color: white; outline: none; transition: 0.3s; }
        .input-style:focus { border-color: #38bdf8; box-shadow: 0 0 10px rgba(56, 189, 248, 0.3); }
        .result-card { transition: all 0.5s ease; transform: scale(0.9); opacity: 0; }
        .result-card.show { transform: scale(1); opacity: 1; }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <div class="glass p-8 w-full max-w-md shadow-2xl">
        <h1 class="text-2xl font-bold text-center mb-6 text-sky-400"><i class="fas fa-robot mr-2"></i> AI Logic Processor</h1>
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm text-slate-400 mb-1">Dãy số (4-5 chữ số)</label>
                <input type="text" id="sequence" class="input-style" placeholder="Ví dụ: 12345" maxlength="5">
            </div>

            <div>
                <label class="block text-sm text-slate-400 mb-1">Mã nhận diện (VD: #1, #2...)</label>
                <input type="text" id="code" class="input-style" placeholder="#1">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm text-slate-400 mb-1">Số cộng 1</label>
                    <input type="number" id="plus1" class="input-style" placeholder="Số 1">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">Số cộng 2</label>
                    <input type="number" id="plus2" class="input-style" placeholder="Số 2">
                </div>
            </div>

            <button onclick="processAI()" class="w-full bg-sky-500 hover:bg-sky-400 text-white font-bold py-3 rounded-lg transition duration-300 shadow-lg mt-4">
                PHÂN TÍCH NGAY
            </button>
        </div>

        <div id="resultArea" class="result-card mt-8 text-center p-6 rounded-xl bg-slate-800 border border-slate-700">
            <p class="text-slate-400 text-sm mb-2">KẾT QUẢ SO SÁNH</p>
            <div id="finalChar" class="text-7xl font-black mb-2">?</div>
            <div id="detailLog" class="text-xs text-slate-500 italic mt-2"></div>
        </div>
    </div>

    <script>
        function sumDigits(n) {
            n = Math.abs(n);
            while (n >= 10) {
                n = n.toString().split('').reduce((acc, curr) => acc + parseInt(curr), 0);
            }
            return n;
        }

        function processAI() {
            const seq = document.getElementById('sequence').value;
            const code = document.getElementById('code').value;
            const p1 = parseInt(document.getElementById('plus1').value) || 0;
            const p2 = parseInt(document.getElementById('plus2').value) || 0;

            if (!seq || !code.startsWith('#')) {
                alert("Vui lòng nhập đúng định dạng!");
                return;
            }

            // Lấy vị trí bắt đầu dựa trên mã #
            let startIndex = parseInt(code.replace('#', '')) - 1;
            let n1 = parseInt(seq[startIndex % seq.length]);
            let n2 = parseInt(seq[(startIndex + 1) % seq.length]);

            // Tính tổng và rút gọn về 1 chữ số
            let total1 = sumDigits(n1 + p1);
            let total2 = sumDigits(n2 + p2);

            // So sánh
            let result = "";
            let color = "";
            if (total1 > total2) { result = "P"; color = "#f87171"; }
            else if (total1 < total2) { result = "B"; color = "#34d399"; }
            else { result = "H"; color = "#fbbf24"; }

            // Hiển thị
            const resCard = document.getElementById('resultArea');
            const charDiv = document.getElementById('finalChar');
            const detailDiv = document.getElementById('detailLog');

            resCard.classList.add('show');
            charDiv.innerText = result;
            charDiv.style.color = color;
            detailDiv.innerText = `Logic: (${n1}+${p1}=${total1}) vs (${n2}+${p2}=${total2})`;
        }
    </script>
</body>
</html>
