<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tra Cứu PBT</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background-color: #e9ecef; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
        .input-group { display: flex; gap: 15px; margin-bottom: 25px; justify-content: center; }
        input { width: 80px; height: 50px; text-align: center; font-size: 1.5rem; text-transform: uppercase; border: 2px solid #ddd; border-radius: 10px; outline: none; transition: border-color 0.3s; }
        input:focus { border-color: #007bff; }
        
        .display-group { display: flex; gap: 20px; margin-top: 30px; justify-content: center; }
        .box { width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; font-weight: bold; border-radius: 12px; color: white; font-size: 1.8rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .p-box { background-color: #28a745; } /* Xanh */
        .b-box { background-color: #dc3545; } /* Đỏ */
        .t-box { background-color: #ffffff; color: #333; border: 1px solid #ccc; } /* Trắng */

        #resultArea { margin-top: 25px; font-size: 2rem; font-weight: bold; min-height: 50px; }
        
        .new-entry { margin-top: 20px; padding: 20px; background: #fff3cd; border-radius: 10px; border: 1px solid #ffeeba; }
        .btn-save { padding: 10px 25px; cursor: pointer; background: #28a745; color: white; border: none; border-radius: 5px; font-size: 1rem; margin-top: 10px; }
        .btn-save:hover { background: #218838; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h2>HỆ THỐNG TRA CỨU</h2>

        <div class="input-group">
            <input type="text" id="input1" maxlength="3" placeholder="..." oninput="checkData()">
            <input type="text" id="input2" maxlength="3" placeholder="..." oninput="checkData()">
        </div>

        <div id="resultArea"></div>

        <div id="newEntryForm" class="new-entry hidden">
            <p style="margin:0 0 10px 0;">Chuỗi mới! Nhập kết quả (P/B/T/H):</p>
            <input type="text" id="newResult" maxlength="1" style="width: 50px; height: 40px; margin-bottom: 10px;">
            <br>
            <button class="btn-save" onclick="saveNewData()">XÁC NHẬN LƯU</button>
        </div>

        <div class="display-group">
            <div class="box p-box">P</div>
            <div class="box b-box">B</div>
            <div class="box t-box">T</div>
        </div>
    </div>

    <script>
        // Dữ liệu mặc định bạn đã gửi
        let dataStore = {
            "PPB BPP": "H", "BBB BPB": "P",
            "PBT BTP": "B", "BBP BPP": "P",
            "BTB PBB": "P", "BPP TPB": "P",
            "TBP BBP": "P", "PPP BBB": "P",
            "BPP TPP": "P", "PPP PPP": "H",
            "PPP PBB": "B", "BPP BPB": "B",
            "PPB PPT": "B", "PPP BPP": "P",
            "PBB TPB": "P", "BBP BBP": "B",
            "BPB BPP": "P", "PBP PPP": "P",
            "BPP BBB": "P", "PPP PTB": "P",
            "PPP PBP": "P", "PBT PTP": "P",
            "BTP BTP": "P"
        };

        function checkData() {
            const in1 = document.getElementById('input1').value.toUpperCase();
            const in2 = document.getElementById('input2').value.toUpperCase();
            const resultArea = document.getElementById('resultArea');
            const form = document.getElementById('newEntryForm');

            if (in1.length === 3 && in2.length === 3) {
                const query = `${in1} ${in2}`;
                
                if (dataStore[query]) {
                    const res = dataStore[query];
                    resultArea.innerText = res;
                    // Đổi màu chữ kết quả
                    if(res === 'P') resultArea.style.color = "#28a745";
                    else if(res === 'B') resultArea.style.color = "#dc3545";
                    else if(res === 'H') resultArea.style.color = "#6c757d";
                    else resultArea.style.color = "#333";
                    
                    form.classList.add('hidden');
                } else {
                    resultArea.innerText = "???";
                    resultArea.style.color = "#ff8c00";
                    form.classList.remove('hidden');
                }
            } else {
                resultArea.innerText = "";
                form.classList.add('hidden');
            }
        }

        function saveNewData() {
            const in1 = document.getElementById('input1').value.toUpperCase();
            const in2 = document.getElementById('input2').value.toUpperCase();
            const newRes = document.getElementById('newResult').value.toUpperCase();
            
            if (newRes) {
                const query = `${in1} ${in2}`;
                dataStore[query] = newRes;
                alert("Đã lưu: " + query + " = " + newRes);
                document.getElementById('newResult').value = "";
                checkData();
            }
        }
    </script>
</body>
</html>
