<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>AI MATRIX LOGIC V3</title>
    <style>
        body {
            background-color: #000;
            color: #0f0;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .grid-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 2px solid #0f0;
            padding: 20px;
            background: rgba(0, 40, 0, 0.3);
        }

        label { font-size: 1.2rem; margin-bottom: 10px; color: #0f0; }

        input {
            background: #000;
            border: 1px solid #0f0;
            color: #0f0;
            font-size: 3rem;
            width: 120px;
            text-align: center;
            padding: 10px;
            outline: none;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.2);
        }

        button {
            background: #0f0;
            color: #000;
            border: none;
            padding: 20px 50px;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 20px #0f0;
            transition: 0.3s;
        }

        button:hover { transform: scale(1.1); background: #0c0; }

        #display-process {
            margin-top: 20px;
            font-size: 1rem;
            color: #888;
            height: 20px;
        }

        #final-result {
            margin-top: 30px;
            font-size: 10rem;
            font-weight: bold;
            text-shadow: 0 0 30px currentColor;
        }

        .scanline {
            width: 100%; height: 2px; background: rgba(0, 255, 0, 0.1);
            position: fixed; top: 0; animation: scan 4s linear infinite;
        }
        @keyframes scan { from { top: 0; } to { top: 100%; } }
    </style>
</head>
<body>
    <div class="scanline"></div>
    <h1 style="text-shadow: 0 0 10px #0f0;">AI DATA ANALYZER</h1>

    <div class="grid-inputs">
        <div class="input-group">
            <label>Ô 1 (P)</label>
            <input type="number" id="v1" placeholder="0">
        </div>
        <div class="input-group">
            <label>Ô 2 (B)</label>
            <input type="number" id="v2" placeholder="0">
        </div>
        <div class="input-group">
            <label>Ô 3</label>
            <input type="number" id="v3" placeholder="0">
        </div>
        <div class="input-group">
            <label>Ô 4</label>
            <input type="number" id="v4" placeholder="0">
        </div>
    </div>

    <button onclick="aiAnalyze()">RUN AI ANALYSIS</button>

    <div id="display-process"></div>
    <div id="final-result"></div>

    <script>
        function reduceToSingleDigit(n) {
            n = Math.abs(Math.floor(n));
            while (n >= 10) {
                let sum = 0;
                let s = n.toString();
                for (let char of s) sum += parseInt(char);
                n = sum;
            }
            return n;
        }

        function aiAnalyze() {
            // Lấy giá trị 4 ô
            const n1 = parseInt(document.getElementById('v1').value) || 0;
            const n2 = parseInt(document.getElementById('v2').value) || 0;
            const n3 = parseInt(document.getElementById('v3').value) || 0;
            const n4 = parseInt(document.getElementById('v4').value) || 0;

            // 1. Tính tổng 4 ô
            const total = n1 + n2 + n3 + n4;
            
            // 2. Tách hàng chục và hàng đơn vị của tổng
            // Ví dụ: tổng = 25 -> chuc = 2, donVi = 5. Nếu tổng < 10 thì chuc = 0.
            const chuc = Math.floor((total % 100) / 10);
            const donVi = total % 10;

            // 3. Cộng vào ô 1 và ô 2
            let finalP_Raw = n1 + chuc;
            let finalB_Raw = n2 + donVi;

            // 4. Cộng dồn cho đến khi còn 1 chữ số
            const finalP = reduceToSingleDigit(finalP_Raw);
            const finalB = reduceToSingleDigit(finalB_Raw);

            // Hiển thị kết quả
            const resDiv = document.getElementById('final-result');
            const processDiv = document.getElementById('display-process');
            
            processDiv.innerText = `Total: ${total} | P-Process: ${n1}+${chuc} | B-Process: ${n2}+${donVi}`;

            if (finalP > finalB) {
                resDiv.innerText = "P";
                resDiv.style.color = "#ff0000";
            } else if (finalB > finalP) {
                resDiv.innerText = "B";
                resDiv.style.color = "#0080ff";
            } else {
                resDiv.innerText = "H";
                resDiv.style.color = "#0f0";
            }
        }
    </script>
</body>
</html>
